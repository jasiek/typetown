name: Release

on:
  push:
    tags: ["v*"]

permissions:
  contents: write # to create the release and upload the archives

jobs:
  release:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0 # so `git describe` can see the tag

      - uses: actions/setup-go@v7
        with:
          go-version-file: go.mod
          check-latest: true

      # A tag should not ship if it does not pass, even though CI already ran on
      # the commit: tags can be moved onto anything.
      - name: Verify
        run: |
          go vet ./...
          go test -race -count=1 ./...

      - name: Build
        run: |
          set -euo pipefail
          version="${GITHUB_REF_NAME}"
          mkdir -p dist
          for target in linux/amd64 linux/arm64 darwin/amd64 darwin/arm64 windows/amd64; do
            os="${target%/*}"; arch="${target#*/}"
            ext=""; [ "$os" = windows ] && ext=".exe"
            name="typetown_${version}_${os}_${arch}"
            mkdir -p "dist/$name"
            # -trimpath so the binary does not carry the builder's paths,
            # CGO_ENABLED=0 so it runs on any libc, and the version stamped in
            # because an archived binary has no VCS metadata to fall back on.
            GOOS="$os" GOARCH="$arch" CGO_ENABLED=0 go build \
              -trimpath \
              -ldflags "-s -w -X github.com/jasiek/typetown/internal/cli.version=${version}" \
              -o "dist/$name/typetown${ext}" ./cmd/typetown
            cp README.md LICENSE "dist/$name/" 2>/dev/null || cp README.md "dist/$name/"
            if [ "$os" = windows ]; then
              (cd dist && zip -qr "${name}.zip" "$name")
            else
              (cd dist && tar -czf "${name}.tar.gz" "$name")
            fi
            rm -rf "dist/$name"
          done
          (cd dist && sha256sum * > checksums.txt)
          ls -la dist

      - name: Publish
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          # A tag with a hyphen is a pre-release by semver: v0.3.0-rc.1.
          prerelease=""
          case "$GITHUB_REF_NAME" in *-*) prerelease="--prerelease";; esac
          gh release create "$GITHUB_REF_NAME" dist/* \
            --title "$GITHUB_REF_NAME" \
            --generate-notes \
            --verify-tag \
            $prerelease
