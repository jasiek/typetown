name: Index

# Builds the full world index and publishes it as a release asset, so that
# people who want the index do not have to fetch 625 MB from GeoNames and spend
# a few minutes of CPU on it themselves.
#
# It is a release rather than a workflow artifact because an artifact is only a
# download for somebody logged in to GitHub, expires after 90 days, and has no
# stable URL. A release asset is anonymously downloadable, permanent, and always
# at the same address.
#
# Run it from the Actions tab. Building takes long enough that it is not worth
# repeating for an index that would come out the same, so the run first works
# out what the result depends on — the upstream data and the code that turns it
# into an index — and stops when what is published already matches. Adding a
# `schedule:` here would then be cheap: the no-op path is four HEAD requests.
on:
  workflow_dispatch:
    inputs:
      force:
        description: "Rebuild even if the published index is already current"
        type: boolean
        default: false

permissions:
  contents: write # to publish the index as a release asset

# One index build at a time. Not cancel-in-progress: a run this long that is
# already past the download should be allowed to finish.
concurrency:
  group: index
  cancel-in-progress: false

env:
  # A tag that never moves and a filename that never changes, because together
  # they are the download URL, which is the point of publishing this way.
  TAG: index-latest
  ASSET: typetown-index.zip

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 90
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-go@v7
        with:
          go-version-file: go.mod
          check-latest: true

      # Half of what the index depends on. Without this an index built by an
      # older commit would be left published after a change to the parser, the
      # ranking or the on-disk format, since none of those move the dump sizes
      # the other half of the key is made of — and a FormatVersion bump would
      # leave that index rejected outright by the reader.
      #
      # Hashing the packages that produce an index rather than the commit means
      # a README or serve-side change does not cost a rebuild. Test files are
      # left out for the same reason: they cannot change what Build writes.
      - name: Fingerprint the builder
        id: code
        run: |
          set -euo pipefail
          files=$({ git ls-files 'internal/index/*.go' 'internal/geonames/*.go' \
                      internal/cli/build.go go.mod go.sum \
                    | grep -v '_test\.go$'; } || true)
          test -n "$files" || { echo "no builder sources matched"; exit 1; }
          echo "$files"
          fp=$(echo "$files" | xargs sha256sum | sha256sum | cut -c1-8)
          echo "fingerprint=$fp" >> "$GITHUB_OUTPUT"

      # The other half, in four HEAD requests rather than 625 MB. Content-Length
      # is what the fingerprint covers, because the dumps are regenerated every
      # night whether or not anything changed: Last-Modified therefore always
      # moves, and so does the ETag, which Apache builds out of the size and the
      # mtime ("7bbe-65b544b954a27"). Size is the only header here that tracks
      # the data — re-zipping unchanged rows produces the same number of bytes.
      # It is not a checksum, so two different dumps of identical length would
      # be missed; `force` is the way out of that.
      - name: Fingerprint the upstream data
        id: upstream
        env:
          CODE_FP: ${{ steps.code.outputs.fingerprint }}
        run: |
          set -euo pipefail
          base=$(sed -n 's/^GEONAMES[[:space:]]*:=[[:space:]]*//p' Makefile)
          test -n "$base" || { echo "no GEONAMES URL in the Makefile"; exit 1; }

          : > "$RUNNER_TEMP/upstream.txt"
          : > "$RUNNER_TEMP/sizes.txt"
          for f in allCountries.zip alternateNamesV2.zip admin1CodesASCII.txt countryInfo.txt; do
            # Kept apart from the parsing below so that a failed HEAD stops the
            # run here, rather than being read as a file that reports nothing.
            raw=$(curl -fsSIL --retry 3 --retry-delay 5 "$base/$f") \
              || { echo "HEAD $base/$f failed"; exit 1; }
            headers=$(printf '%s\n' "$raw" | tr -d '\r' \
              | grep -iE '^(last-modified|content-length):' \
              | tr 'A-Z' 'a-z' | sort) || true
            # -L can leave more than one response in $raw; the last one is the
            # file itself.
            size=$(printf '%s\n' "$headers" | sed -n 's/^content-length:[[:space:]]*//p' | tail -n 1)
            # Without a size there is nothing to compare, and silently
            # fingerprinting nothing would mean never rebuilding again.
            case "$size" in
              "" | *[!0-9]*) echo "$base/$f served no usable content-length"; exit 1 ;;
            esac
            printf '%s %s\n' "$f" "$size" >> "$RUNNER_TEMP/sizes.txt"
            printf '%s\n%s\n' "$f" "$headers" >> "$RUNNER_TEMP/upstream.txt"
          done

          cat "$RUNNER_TEMP/upstream.txt"
          fp=$(sha256sum "$RUNNER_TEMP/sizes.txt" | cut -c1-8)
          echo "fingerprint=$fp" >> "$GITHUB_OUTPUT"
          echo "key=$fp-$CODE_FP" >> "$GITHUB_OUTPUT"

      # The published index is the state. SOURCES.txt ships beside the archive
      # precisely so this can be answered by reading a few hundred bytes rather
      # than the 250 MB it describes.
      - name: Compare with what is published
        id: published
        env:
          GH_TOKEN: ${{ github.token }}
          KEY: ${{ steps.upstream.outputs.key }}
          FORCE: ${{ inputs.force }}
        run: |
          set -euo pipefail
          if [ "$FORCE" = "true" ]; then
            echo "forced; building regardless"
            echo "current=false" >> "$GITHUB_OUTPUT"
            exit 0
          fi
          dir="$RUNNER_TEMP/published"
          rm -rf "$dir"
          mkdir -p "$dir"
          # Absent for the very first run, and for a release whose assets were
          # removed by hand; both mean there is nothing current to match.
          gh release download "$TAG" --pattern SOURCES.txt --dir "$dir" || true
          have=$(sed -n 's/^key:[[:space:]]*//p' "$dir/SOURCES.txt" 2>/dev/null || true)
          echo "published: ${have:-none}"
          echo "computed:  $KEY"
          if [ "$have" = "$KEY" ]; then
            echo "current=true" >> "$GITHUB_OUTPUT"
          else
            echo "current=false" >> "$GITHUB_OUTPUT"
          fi

      - name: Fetch the sources
        if: steps.published.outputs.current != 'true'
        run: make sources

      - name: Build the index
        if: steps.published.outputs.current != 'true'
        run: make index

      # An index that cannot answer a query is not worth publishing, and the
      # build is far too long to discover that from a bug report.
      - name: Smoke-test the index
        if: steps.published.outputs.current != 'true'
        run: |
          set -euo pipefail
          out=$(go run ./cmd/typetown query -index index -json -limit 3 london)
          echo "$out"
          echo "$out" | grep -qi london

      # SOURCES.txt goes both inside the archive, so a downloaded index can be
      # traced back to where it came from, and beside it, so the next run can
      # read the key without downloading the index.
      - name: Package the index
        if: steps.published.outputs.current != 'true'
        env:
          KEY: ${{ steps.upstream.outputs.key }}
          DATA_FP: ${{ steps.upstream.outputs.fingerprint }}
          CODE_FP: ${{ steps.code.outputs.fingerprint }}
        run: |
          set -euo pipefail
          {
            echo "typetown index"
            echo "key:     $KEY"
            echo "data:    $DATA_FP"
            echo "builder: $CODE_FP"
            echo "built:   $(date -u +%Y-%m-%dT%H:%M:%SZ)"
            echo "commit:  $GITHUB_SHA"
            echo "run:     $GITHUB_SERVER_URL/$GITHUB_REPOSITORY/actions/runs/$GITHUB_RUN_ID"
            echo
            echo "upstream (as reported by download.geonames.org):"
            sed 's/^/  /' "$RUNNER_TEMP/upstream.txt"
          } > index/SOURCES.txt
          cat index/SOURCES.txt
          cp index/SOURCES.txt "$RUNNER_TEMP/SOURCES.txt"

          # Archived with the directory, so unzipping gives an index/ to point
          # -index at rather than seven files in the current directory.
          zip -qr "$RUNNER_TEMP/$ASSET" index
          (cd "$RUNNER_TEMP" && sha256sum "$ASSET" > "$ASSET.sha256")
          ls -la "$RUNNER_TEMP/$ASSET" "$RUNNER_TEMP/$ASSET.sha256"

      # The release is regenerated in place: same tag, same filenames, so the
      # download URL in the README keeps working. Marked a pre-release so it
      # never takes the "Latest release" slot from the v* tags, which are what
      # `go install` follows.
      - name: Publish the release
        id: publish
        if: steps.published.outputs.current != 'true'
        env:
          GH_TOKEN: ${{ github.token }}
          KEY: ${{ steps.upstream.outputs.key }}
        run: |
          set -euo pipefail
          url="$GITHUB_SERVER_URL/$GITHUB_REPOSITORY/releases/download/$TAG/$ASSET"
          sha=$(cut -d' ' -f1 "$RUNNER_TEMP/$ASSET.sha256")
          notes="$RUNNER_TEMP/notes.md"
          {
            echo "The whole world, ready to unzip and point typetown at."
            echo
            echo '```sh'
            echo "curl -fLO $url"
            echo "unzip $ASSET"
            echo "typetown serve -index index"
            echo '```'
            echo
            echo "| | |"
            echo "|---|---|"
            echo "| built | $(date -u +%Y-%m-%dT%H:%M:%SZ) |"
            echo "| commit | \`$GITHUB_SHA\` |"
            echo "| run | $GITHUB_SERVER_URL/$GITHUB_REPOSITORY/actions/runs/$GITHUB_RUN_ID |"
            echo "| key | \`$KEY\` |"
            echo "| sha256 | \`$sha\` |"
            echo
            echo "This release is regenerated in place whenever the GeoNames data or the"
            echo "index builder changes, so the URL above always serves the current index."
            echo "The \`$TAG\` tag is a fixed anchor for that URL; the commit the asset was"
            echo "built from is the one in the table, and in the SOURCES.txt inside."
            echo
            echo "Upstream:"
            echo
            echo '```'
            cat "$RUNNER_TEMP/upstream.txt"
            echo '```'
          } > "$notes"

          title="World index ($(date -u +%Y-%m-%d))"
          assets="$RUNNER_TEMP/$ASSET $RUNNER_TEMP/$ASSET.sha256 $RUNNER_TEMP/SOURCES.txt"
          if gh release view "$TAG" >/dev/null 2>&1; then
            gh release edit "$TAG" --title "$title" --notes-file "$notes" --prerelease
            # shellcheck disable=SC2086
            gh release upload "$TAG" $assets --clobber
          else
            # shellcheck disable=SC2086
            gh release create "$TAG" $assets \
              --target "$GITHUB_SHA" \
              --title "$title" \
              --notes-file "$notes" \
              --prerelease
          fi
          echo "url=$url" >> "$GITHUB_OUTPUT"

      - name: Summary
        if: always()
        env:
          KEY: ${{ steps.upstream.outputs.key }}
          CURRENT: ${{ steps.published.outputs.current }}
          URL: ${{ steps.publish.outputs.url }}
        run: |
          {
            echo "### Index"
            echo
            echo "Key \`${KEY:-unknown}\` (data, then builder)."
            echo
            if [ "$CURRENT" = "true" ]; then
              echo "The published index is already built from this data by this builder, so nothing was rebuilt."
              echo "Re-run with **force** to build it again anyway."
            elif [ -n "$URL" ]; then
              echo "Published: $URL"
            else
              echo "Nothing was published; see the failing step above."
            fi
            if [ -s "$RUNNER_TEMP/upstream.txt" ]; then
              echo
              echo '```'
              cat "$RUNNER_TEMP/upstream.txt"
              echo '```'
            fi
          } >> "$GITHUB_STEP_SUMMARY"
